[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen-team"
version = "1.0.0"
description = "Znovupoužitelný modul pro generování bludiště (42 projekt)"
readme = "mazegen_package/README.md"
requires-python = ">=3.10"
authors = [
    { name = "Svitlana" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mazegen_package*"]